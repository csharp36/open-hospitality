[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-hospitality"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.1",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.2",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=50.0.0",
    "pyhpke>=0.6.5",
    "google-cloud-storage>=3.13.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Face matching (Pillar F): heavy, optional, dark-flagged. The core install
# never pays for onnxruntime; the engine imports lazily and fails loudly.
face = [
    "onnxruntime>=1.28.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]
dev = [
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.16.2",
    "mypy>=2.3.0",
    "types-PyYAML",
    "types-defusedxml",
]

[project.scripts]
usali = "usali.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usali = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/test_models.py" = ["F401"]
"tests/test_stage.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
packages = ["usali"]
strict = true

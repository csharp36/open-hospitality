[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-hospitality"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.13.0",
    "cryptography>=50.0.1",
    "pyhpke>=0.6.5",
    "google-cloud-storage>=3.13.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Face matching (Pillar F): heavy, optional, dark-flagged. The core install
# never pays for onnxruntime; the engine imports lazily and fails loudly.
face = [
    "onnxruntime>=1.29.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
]
dev = [
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "types-PyYAML",
    "types-defusedxml",
]

[project.scripts]
usali = "usali.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usali = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# Ruff's DEFAULT rule set is version-dependent, and 0.16 widened it sharply
# (FURB, I, RUF, B, UP, DTZ, SIM, ... — 905 findings on a codebase that was
# clean the release before). With no explicit `select`, the lint gate was
# pinned only by uv.lock, so a routine dependency bump silently changed which
# rules run. Name them instead: this is ruff's pre-0.16 default set, so this
# bump is a no-op for the gate.
#
# The trade is that we now OWN this list — new upstream rules do not arrive on
# their own. Adopt further families deliberately, one PR each, together with
# the fixes they demand. `uvx ruff@latest check --statistics` (with `select`
# commented out) shows what the current default would flag.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_models.py" = ["F401"]
"tests/test_stage.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
packages = ["usali"]
strict = true

[dependency-groups]
dev = [
    "reportlab>=5.0.1",
]

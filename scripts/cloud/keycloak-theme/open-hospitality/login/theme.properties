# Open Hospitality login theme (K / branding).
# Layers a pine-and-brass skin over the stock Keycloak login theme: we
# inherit the classic theme's markup and PatternFly base, then append
# one stylesheet. `styles` lists css/login.css (resolved from the
# parent) FIRST so the base loads, then our overrides.
parent=keycloak
import=common/keycloak
styles=css/login.css css/oh-brand.css

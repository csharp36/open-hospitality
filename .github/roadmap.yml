# Open Hospitality — canonical roadmap.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH the triage bot dedups new feature
# requests against (see .github/scripts/triage_issue.py). Keep it curated:
# one entry per planned or accepted capability, with a stable `id` the bot can
# cite in a "this is already on the roadmap" comment.
#
# Fields:
#   id       stable slug, never reused (OH-<n>)
#   title    one line
#   summary  what it delivers and why — this is what the bot matches against,
#            so describe the USER-FACING capability, not the implementation
#   status   planned | in-progress | shipped | considering
#   tags     freeform, for humans
#   issue    optional GitHub issue number this capability is tracked in
#
# OH-1..OH-5 and OH-16..OH-21 are the productization roadmap. OH-6..OH-15
# mirror the analytics backlog tracked in issue #17 — one roadmap entry per
# child issue — so the bot dedups incoming analytics/reporting requests against
# it. The bot only dedups against what's here, and matches on `summary`, so
# keep those user-facing.
#
# Sequencing and the gap analysis behind these entries live in
# docs/ROADMAP.md; this file stays the canonical catalogue the bot reads.

roadmap:
  - id: OH-1
    title: Self-service tenant onboarding
    summary: >
      A new hotel group can sign up and reach a working portal immediately —
      uploading PMS reports and seeing real USALI results with no integrations
      configured — then close the remaining setup items (payroll, accounting,
      billing) whenever they choose. No sandbox tier and no promotion event.
      Turns the single-org trust boundary into a real multi-tenant security
      boundary between strangers.
    status: in-progress
    tags: [multi-tenancy, onboarding, billing]

  - id: OH-2
    title: Additional PMS connectors
    summary: >
      Ingest report/exports from more property-management systems beyond the
      currently supported set (Opera, AutoClerk, SkyTouch), via the extensible
      source detection registry. Covers new file shapes and per-property quirks.
    status: considering
    tags: [ingestion, pms, integrations]

  - id: OH-3
    title: Observability and telemetry
    summary: >
      Metrics, tracing, and structured logs for a hosted deployment — while
      honoring the disclosure rules (logs carry employee_ids, never names).
      Dashboards for ingestion health, RLS denials, and per-tenant usage.
    status: planned
    tags: [ops, observability]

  - id: OH-4
    title: CI/CD automation
    summary: >
      Automated build, test, and deploy pipeline replacing the scripted-manual
      cloud deploys, so releases are one-click and reproducible.
    status: planned
    tags: [ops, ci-cd]

  - id: OH-5
    title: Self-hostable deploy guide
    summary: >
      A vendor-neutral "run your own Open Hospitality" guide and parametrized
      deploy scripts, so an operator can stand up their own instance on their
      own cloud without the private hosted-demo specifics.
    status: considering
    tags: [docs, deployment, self-host]

  # --- Analytics backlog (tracked in issue #17) ------------------------------

  - id: OH-6
    title: Property configuration — room inventory and fiscal calendar
    summary: >
      Configure a property's sellable room inventory (effective-dated), track
      out-of-order rooms by date range, and define the fiscal calendar
      (calendar-month or 4-4-5). The authoritative basis every occupancy and
      RevPAR figure divides by.
    status: shipped
    tags: [analytics, configuration]
    issue: 8

  - id: OH-7
    title: Core performance statistics (occupancy, ADR, RevPAR, TRevPAR, GOPPAR, CPOR)
    summary: >
      Occupancy, ADR, RevPAR, TRevPAR, GOPPAR, cost-per-occupied-room, and
      labor-hours per occupied room for any date range or fiscal period — with
      prior-period, prior-year, week-over-week, month-to-date, and 30-day
      rolling comparisons, drilling through to the underlying transactions.
    status: in-progress  # shipped except GOPPAR and non-labor CPOR (issue #26)
    tags: [analytics, reporting]
    issue: 9

  - id: OH-8
    title: Budget import and variance reporting
    summary: >
      Import an annual budget (by USALI line and month, money and statistical
      lines, including labor-hours budgets) and render the operating statement
      with actual / budget / variance / variance% columns — money and
      labor-hours variance alike. Versioned budgets with one reporting baseline.
    status: planned
    tags: [analytics, ingestion, reporting]
    issue: 10

  - id: OH-9
    title: Ledger anomaly detection
    summary: >
      Deterministic, server-side detectors that flag absent accruals, magnitude
      breaks against trailing/prior-year, cross-source divergence, and
      sign/classification errors in the ledger — with a dismissible,
      carry-forward flag lifecycle.
    status: considering
    tags: [analytics, ai]
    issue: 11

  - id: OH-10
    title: GOP-to-net-income bridge and debt service coverage (DSCR)
    summary: >
      Extend the statement below GOP — management fees, fixed charges, FF&E
      reserve, interest, depreciation — with a per-property debt schedule and
      derived EBITDA, NOI, net income, and debt-service-coverage ratio, each
      with its definition stated.
    status: planned
    tags: [analytics, reporting]
    issue: 12

  - id: OH-11
    title: Portfolio roll-up across properties
    summary: >
      Consolidated operating statement and rooms-weighted statistics across a
      set of properties on a common USALI structure, with per-property
      drill-through and explicit handling of mismatched fiscal calendars.
    status: planned
    tags: [analytics, reporting]
    issue: 13

  - id: OH-12
    title: Weekly and monthly performance narrative and open-items register
    summary: >
      A generated performance narrative on a weekly or monthly cadence — with
      daily standouts, week-over-week and month-over-month deltas, day-of-week
      patterns, labor commentary, anomaly flags, and cross-property synthesis —
      plus an open-items register carried across periods. Numbers are computed;
      the generator writes prose about them and never introduces a figure of
      its own.
    status: considering
    tags: [reporting, ai]
    issue: 14

  - id: OH-13
    title: STAR / comp-set ingestion and index reporting
    summary: >
      Ingest STAR/STR comp-set data (index, rank, comp-set occupancy/ADR/
      RevPAR), report it alongside the platform's own statistics, and reconcile
      STAR-reported against platform-computed revenue. Built behind a feature
      flag; enablement is gated on the operator's own STR license and a
      subscriber-terms review (see #15).
    status: considering
    tags: [analytics, ingestion]
    issue: 15

  - id: OH-14
    title: Reporting packet export (Word, PDF, Excel)
    summary: >
      Export a configurable reporting packet — operating statement, statistics,
      variance, the monthly narrative, and open items — to Word, PDF, and Excel
      for lenders, accountants, and partners, with exported figures matching the
      on-screen report exactly.
    status: planned
    tags: [reporting]
    issue: 16

  - id: OH-15
    title: Operational KPI alerts (daily/weekly performance flash)
    summary: >
      Per-property alerts on the operating KPIs — out-of-range ADR/RevPAR/
      occupancy, week-over-week day-of-week swings, 30-day rolling-mean
      outliers, labor over budget, and data-completeness gaps — deterministic
      and computed server-side, distinct from ledger anomaly detection (OH-9).
    status: considering
    tags: [analytics, reporting, ai]
    issue: 19

  # --- Productization, continued (see docs/ROADMAP.md) -----------------------

  - id: OH-16
    title: Public marketing front door
    summary: >
      A public website that explains what the product does, who it is for, and
      what it costs, and that leads a hotel owner who has never heard of USALI
      into the try-it-now preview and then signup. The discovery surface ahead
      of the product itself.
    status: planned
    tags: [marketing, onboarding, growth]

  - id: OH-17
    title: Connect your own accounting and payroll accounts
    summary: >
      Each hotel connects its OWN QuickBooks Online, Gusto, or ADP account from
      inside the app — authorizing once, with its own credentials stored
      encrypted and used only for that property. The per-tenant storage,
      resolution, and OAuth backend exist now, and the /integrations page ties
      them together: an org_admin connects QuickBooks through its OAuth
      redirect, or Gusto and ADP through a credential form, and can disconnect
      or replace what is stored.
    status: shipped  # /integrations page (org_admin-gated nav entry) drives the OAuth and credential-form backend from ROADMAP §2.1
    tags: [integrations, multi-tenancy, payroll, accounting]

  - id: OH-18
    title: Onboarding checklist of open setup items
    summary: >
      A persistent, resumable "what is left to set up" list per hotel — each
      integration (PMS connection, payroll, accounting, demand feed, billing)
      shown as an open item the operator closes when they choose, or never if
      they do not use it. An unconfigured integration reads as honestly off,
      never as a sample figure.
    status: shipped  # the checklist itself; the connect surfaces are OH-17
    tags: [onboarding, multi-tenancy]

  - id: OH-19
    title: Subscription plans and billing
    summary: >
      Paid subscription for the hosted service — plan selection, a trial with a
      defined end, payment details, invoices, and the entitlement rules that
      decide what a plan includes. Distinct from the always-free self-hosted
      open-source core.
    status: planned
    tags: [billing, productization]

  - id: OH-20
    title: Review and correct USALI transaction-code mapping
    summary: >
      A property reviews how its own PMS transaction codes map to USALI
      schedules and line items, and corrects a wrong or unmapped code itself —
      necessary where codes are franchise-configurable and differ property to
      property, as SkyTouch's do. Today mapping coverage is visible but not
      editable.
    status: considering
    tags: [mapping, usali, onboarding]

  - id: OH-21
    title: Conversational interface to hotel performance
    summary: >
      Ask questions about a property's performance in plain language — how last
      month compared, where labor ran over, what drove a RevPAR swing — and get
      an answer grounded in the platform's own computed figures. Numbers are
      computed by the engine; the interface explains them and never introduces
      a figure of its own.
    status: considering
    tags: [reporting, ai]

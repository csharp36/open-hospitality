name: Bug report
description: Something is broken or behaves incorrectly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security issue?** Do not file it here —
        see [SECURITY.md](../../security/policy). For anything touching
        cross-tenant access, PII, or pay data, use private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe? What did you expect instead?
      placeholder: I called GET /api/... as a department_manager and saw ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Go to ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system?
      options:
        - Ingestion / USALI mapping
        - Operating statement / reporting
        - Labor analytics
        - Scheduling / time & attendance / kiosk
        - Employees / workforce
        - Payroll / PII vault
        - Auth / tenancy / access control
        - Frontend / UI
        - Deployment / migrations
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or commit SHA, if known.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output. **Redact any real credentials or PII.**
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through private reporting).
          required: true

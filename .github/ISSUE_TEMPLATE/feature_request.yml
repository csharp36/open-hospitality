name: Feature request
description: Propose a new capability or a change in behavior.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer a looser conversation? Start in
        [Discussions › Ideas](../../discussions/categories/ideas) instead.

        **Heads up:** an automated triage bot checks new requests against the
        [roadmap](../../discussions/categories/roadmap) and open issues. If your
        idea is already tracked, the bot will link it and close this as a
        duplicate — so you find the existing thread rather than losing your idea.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you can't today? Describe the need, not just the solution.
      placeholder: As a GM I need ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough is fine.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion / USALI mapping
        - Operating statement / reporting
        - Labor analytics
        - Scheduling / time & attendance / kiosk
        - Employees / workforce
        - Payroll / PII vault
        - Auth / tenancy / access control
        - Frontend / UI
        - Deployment / operations
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, discussions, and the roadmap for duplicates.
          required: true

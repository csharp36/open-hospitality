version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  # The triage workflow installs its own hash-pinned Python deps from
  # .github/triage-requirements.txt (see the workflow-pinning work). Without
  # this block those security-sensitive deps (anthropic, pyyaml, transitive)
  # would receive no updates once that manifest lands.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
      time: "09:05"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 5

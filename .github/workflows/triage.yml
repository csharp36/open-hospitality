name: Issue triage

# Dedup new feature requests against the roadmap + open issues (see
# .github/scripts/triage_issue.py). Only feature requests trigger it —
# the feature template applies the `enhancement` label; bug reports don't.
#
# Requires an ANTHROPIC_API_KEY repo secret. Without it the script no-ops.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'enhancement')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --quiet anthropic pyyaml
      - name: Triage the issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # Swap to claude-opus-4-8 for maximum judgment at higher cost.
          TRIAGE_MODEL: claude-haiku-4-5
          CONFIDENCE_THRESHOLD: '0.8'
        run: python .github/scripts/triage_issue.py

name: CLA

# Blocks a pull request from merging until every commit author has signed the
# Contributor License Agreement. Signatures are recorded in a file in the
# `cla-signatures` branch of this repo, keyed to the GitHub identity.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/csharp36/open-hospitality/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thank you for your contribution. Before we can merge, please sign our [Contributor License Agreement](https://github.com/csharp36/open-hospitality/blob/main/CLA.md) by posting the comment below in this pull request.'

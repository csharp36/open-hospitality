name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync (with dev extras)
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Types (mypy strict, src only)
        run: uv run mypy --strict src
      - name: Tests (pytest — testcontainers uses the runner's Docker)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx oxlint
      - name: Tests
        run: npm test

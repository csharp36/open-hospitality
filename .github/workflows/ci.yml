name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Sync (dev + face extras)
        # `face` pulls numpy + onnxruntime. The engine imports them lazily
        # (face_match.py guards them behind TYPE_CHECKING / try-except), but
        # strict mypy still resolves those imports at type-check time, so they
        # must be installed or the type job fails with import-not-found.
        run: uv sync --extra dev --extra face
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Types (mypy strict, src only)
        run: uv run mypy --strict src
      - name: Tests (pytest — testcontainers uses the runner's Docker)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # ONE source of truth for the Node major: the Dockerfile's frontend build
      # stage, which is what actually builds the shipped bundle. Pinning a
      # literal here let the two drift — the image moved to node 26 while this
      # job stayed on 22, so tests ran on a runtime production no longer used.
      # Dependabot already bumps the Dockerfile, so CI now follows it for free.
      #
      # There is a FLOOR, not just a preference: Node 20's WebCrypto
      # SubtleCrypto.importKey rejects the typed-array key material piiSeal.ts
      # passes (cross-realm ArrayBuffer check), failing the HPKE seal tests and
      # the EmployeesPage tests that render sealed values. Any bump must stay
      # above that.
      - name: Node major (derived from the Dockerfile)
        id: node
        working-directory: .
        run: |
          set -euo pipefail
          version="$(grep -oE '^FROM node:[0-9]+' Dockerfile | head -1 | cut -d: -f2)"
          [ -n "$version" ] || { echo "::error::no 'FROM node:<major>' in Dockerfile"; exit 1; }
          [ "$version" -ge 22 ] || { echo "::error::Node $version is below the WebCrypto floor (22)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "using Node $version (from Dockerfile)"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx oxlint
      - name: Tests
        run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The other jobs run against the RUNNER's toolchain: `backend` uses the
      # runner's Python, `frontend` its own pinned Node. NOTHING here built the
      # Dockerfile, so a base-image or system-dependency change passed CI green
      # and was first exercised by scripts/cloud/deploy_app.sh — i.e. a deploy
      # to the live demo was the smoke test. Two base-image bumps had to be
      # verified by hand before merging to close that gap; this closes it for
      # good.
      - name: Build the deployment image
        run: docker build -t usali-app:ci .
      # Building proves dependencies RESOLVE on the base image. It does not
      # prove the result runs — a wheel can install and still fail to import on
      # a new interpreter. Exercise the runtime surface the serving revision
      # and the Cloud Run jobs actually use.
      - name: Smoke the built image
        run: |
          docker run --rm --entrypoint sh usali-app:ci -c '
            set -e
            python --version
            python -c "import usali, usali.server, usali.cli, usali.kiosk, usali.signup_api"
            usali --help >/dev/null
          '

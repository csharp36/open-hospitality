name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Sync (dev + face extras)
        # `face` pulls numpy + onnxruntime. The engine imports them lazily
        # (face_match.py guards them behind TYPE_CHECKING / try-except), but
        # strict mypy still resolves those imports at type-check time, so they
        # must be installed or the type job fails with import-not-found.
        run: uv sync --extra dev --extra face
      - name: Lint (ruff)
        run: uv run ruff check
      - name: Types (mypy strict, src only)
        run: uv run mypy --strict src
      - name: Tests (pytest — testcontainers uses the runner's Docker)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Match the dev/test runtime. Node 20's WebCrypto SubtleCrypto.importKey
          # rejects the typed-array key material piiSeal.ts passes (cross-realm
          # ArrayBuffer check), failing the HPKE seal tests and the EmployeesPage
          # tests that render sealed values. Node 22 (current LTS) accepts it.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npx oxlint
      - name: Tests
        run: npm test

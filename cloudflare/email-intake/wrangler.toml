name = "oh-email-intake"
main = "src/worker.js"
compatibility_date = "2026-09-21"

# Everything the worker reads out of `env`. The two values here are public —
# the URL is the app's own endpoint and the cap is a number — and the two
# SECRETS are not listed: `INTAKE_SECRET` and `FALLBACK_ADDRESS` are set by
# .github/workflows/deploy-email-intake.yml with `wrangler secret put`, from
# the GitHub secrets EMAIL_INTAKE_SECRET and EMAIL_INTAKE_FALLBACK. A `[vars]`
# entry would put both of them in this file, which is a public repo.
[vars]
INTAKE_URL = "https://demo.mandati.ai/api/intake/email"

# The app's own body cap: `Settings.email_intake_max_bytes` in
# src/usali/config.py is `25 * 1024 * 1024`, and this is the same number. Over
# it the worker forwards to the fallback mailbox without POSTing, so the two
# caps agreeing is what makes the worker's refusal and the app's 413 the same
# boundary rather than two nearby ones.
#
# Cloudflare documents its own message limit as 25 MB decimal (25,000,000),
# marginally BELOW this, so in practice Email Routing refuses an oversized
# message before the worker ever sees it and this cap is the backstop.
MAX_BYTES = 26214400
